$schema: "https://moonrepo.dev/schemas/workspace.json"

# Floor only. Raise it when the repo starts depending on a newer Moon feature.
versionConstraint: ">=2.6.0"

projects:
  root: "."

defaultProject: "root"

hasher:
  ignorePatterns:
    - ".claude/rules"

vcs:
  defaultBranch: "main"
  provider: "github"
  sync: true
  hooks:
    pre-push:
      - "moon run root:prepush"
