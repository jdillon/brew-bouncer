name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: moonrepo/setup-toolchain@v0
        with:
          moon-version: '2.5.5'

      - run: ./scripts/workspace-setup

      - name: Check
        run: moon run root:prepush
