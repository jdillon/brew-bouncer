name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: License headers
        run: bun run license:check

      - name: Stamp build info
        run: bun run build:info

      - name: Typecheck
        run: bun run typecheck

      - name: Test compile
        run: bun build --compile src/index.ts --outfile /tmp/brew-bouncer-test
